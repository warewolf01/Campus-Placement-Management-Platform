<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard — placementhub</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a href="../index.html" class="brand">placement<span style="color:#1d4ed8">hub</span></a>
      <span class="role-tag">Admin</span>
      <nav class="nav">
        <a href="admin-dashboard.html" class="active">Dashboard</a>
      </nav>
      <div id="logoutBtn"><button type="button" class="btn-outline" onclick="adminLogout()">Logout</button></div>
    </aside>

    <main class="main">
      <div class="header-row">
        <div>
          <h2>Admin Dashboard</h2>
        </div>
      </div>

      <!-- Headline numbers -->
      <section class="section">
        <h3>Statistics Overview</h3>
        <div class="stats" id="statsRow">
          <!-- Stat cards populated by JS -->
        </div>
      </section>

      <!-- Branch-wise student distribution -->
      <section class="section">
        <h3>Branch-wise Student Distribution</h3>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Branch</th>
                <th>Students</th>
                <th>Share</th>
              </tr>
            </thead>
            <tbody id="branchBody"></tbody>
          </table>
          <div class="empty" id="branchEmpty" style="display:none">No students registered yet.</div>
        </div>
      </section>

      <!-- Student management: block / unblock -->
      <section class="section" id="students">
        <h3>Student Management</h3>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Branch</th>
                <th>CGPA</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="studentsBody"></tbody>
          </table>
          <div class="empty" id="studentsEmpty" style="display:none">No students registered yet.</div>
        </div>
      </section>
    </main>
  </div>

  <script src="js/admin-common.js"></script>
  <!-- seeds the 10 sample jobs on a fresh browser (only if "jobs" is missing) -->
  <script src="../student/js/data.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
